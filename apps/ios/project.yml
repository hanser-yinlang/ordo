# project.yml —— XcodeGen 工程描述(设计交付要求:同时提供 pbxproj 与 project.yml)
#
# 用法:
#   brew install xcodegen
#   cd apps/ios && xcodegen generate        # 生成 Ordo.xcodeproj
#
# 与 Ordo.xcodeproj/project.pbxproj 等价;新增源文件后可用本文件重新生成。
# KMP 核心的构建与嵌入由 preBuildScripts 里的 Gradle 任务完成
# (`embedAndSignAppleFrameworkForXcode` 会把 OrdoCore.framework 放进产物目录并签名)。

name: Ordo

options:
  bundleIdPrefix: com.ordo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Ordo:
    type: application
    platform: iOS
    sources:
      - path: Ordo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ordo.app
        PRODUCT_NAME: Ordo
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Ordo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # KMP 产物由 Gradle 任务放到 $(SRCROOT)/../../shared/core/build/xcode-frameworks/...
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../shared/core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "OrdoCore"
    preBuildScripts:
      - name: "Build KMP OrdoCore framework"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/../../shared/core"
          ./gradlew :shared:core:embedAndSignAppleFrameworkForXcode

  OrdoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrdoTests
    dependencies:
      - target: Ordo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ordo.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ordo.app/Ordo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Ordo:
    build:
      targets:
        Ordo: all
        OrdoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrdoTests
