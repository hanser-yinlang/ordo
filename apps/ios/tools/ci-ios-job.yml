# ─────────────────────────────────────────────────────────────────────────────
# ci-ios-job.yml —— 修正后的 iOS CI job(供根目录负责人粘贴进 .github/workflows/ci.yml)
#
# 为什么需要修正(两处真实风险):
#   1. 任务名:根 ci.yml 写的是 `gradle :shared:core:assembleXCFramework`,
#      但 shared/core/build.gradle.kts 里是
#          target.binaries.framework { baseName = "OrdoCore"; isStatic = true }
#      KMP 据此注册的任务名是 `assembleOrdoCoreXCFramework`;
#      在只注册了 baseName 派生任务的版本上,通用名 `assembleXCFramework` 不存在
#      → job 会在第一步就失败。下面改用 apps/ios/tools/verify_ios.sh,
#      它**先探测再构建**,两种命名都能命中。
#   2. 模拟器机型:根 ci.yml 硬编码 `name=iPhone 15`,依赖 runner 镜像自带该机型;
#      verify_ios.sh 会从 `xcrun simctl list devices available` 自动挑一个可用 iPhone。
#
# 用法:把下面的 `ios:` 段整体替换 .github/workflows/ci.yml 中现有的 ios job;
#       或在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables
#       新建 ENABLE_IOS_CI=true 后即可触发。
#
# 注意:本文件写在 apps/ios/tools/ 下,是因为 iOS 负责人的写入范围仅限 apps/ios/**;
#       CI 工作流本体在仓库根的 .github/workflows/ci.yml,需由根目录负责人合并。
# ─────────────────────────────────────────────────────────────────────────────

  ios:
    name: iOS(macOS 真实编译)
    runs-on: macos-14
    if: ${{ vars.ENABLE_IOS_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 选定一个本机存在的 Xcode(16+ 才有 Swift 6 / SwiftData / @Observable)
      - name: 显示 Xcode 版本
        run: xcodebuild -version

      # 一条命令完成:探测 XCFramework 任务名 → 生成 → xcodebuild build → 自检
      # 去掉 --build-only 即连单元测试一起跑(耗时更长,但覆盖 OrdoTests 全部用例)
      - name: 生成 XCFramework + 编译 iOS 工程
        run: bash apps/ios/tools/verify_ios.sh --build-only

      - name: 编译前预检 + 源码自检
        if: always()
        working-directory: apps/ios
        run: |
          python3 tools/preflight.py
          python3 tools/check_ios_sources.py
          python3 tools/gen_xcodeproj.py --check

      # 失败时把 xcresult / 构建日志带出来(排查首个编译错误用)
      - name: 上传构建产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            apps/ios/build/*.xcresult
            apps/ios/build/**/*.log
          if-no-files-found: ignore
